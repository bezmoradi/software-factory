name: software-factory

x-image: &image
  image: software-factory:local
  pull_policy: never

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-egress-lists: &egress-lists
  EGRESS_ALLOW: ${SF_ALLOW:-api.anthropic.com,claude.ai,claude.com,platform.claude.com,api.openai.com,auth.openai.com,chatgpt.com},${SF_EXTRA_ALLOW:-}
  EGRESS_DENY: ${SF_EXTRA_DENY:-}

services:
  engine:
    <<: [*image, *hardening]
    build:
      context: .
      target: runtime
    user: engine
    environment:
      <<: *egress-lists
      PORT: "8080"
      GOMEMLIMIT: 800MiB
      SF_PAGE_HOST: 0.0.0.0
      SF_PUBLIC_PORT: ${SF_PORT:-7799}
      SF_PAGE_NAME: engine-page
      SF_AGENT_ADDRESS: 0.0.0.0:8081
      SF_REVIEWER_HOST: reviewer:8090
      SF_REVIEWS: /reviews
      SF_REVIEWER_PROXY: egress-review:3128
      SF_EGRESS_PROXY: egress:3130
      SF_EGRESS_STATUS: egress-control:3129
      SF_EGRESS_KEY_FILE: /run/sf-egress/control-key
      SF_HELPER: helper:8099
      SF_HELPER_KEY_FILE: /run/sf-helper/key
      SF_BOX_SUBNETS: ${SF_BOX_SUBNETS:-}
      SF_UPLOADS: /uploads
      SF_UMASK: "0002"
      SF_OSV: ${SF_OSV:-}
      SF_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
    ports:
      - target: 8080
        published: "${SF_PORT:-7799}"
        host_ip: 127.0.0.1
    networks:
      reviewnet: {}
      controlnet: {}
      helpernet: {}
      outside:
        aliases: [engine-page]
    volumes:
      - engine-state:/var/lib/software-factory
      - workspace:/workspace
      - agents:/opt/software-factory/agents
      - reviews:/reviews
      - uploads:/uploads
      - egress-key:/run/sf-egress
      - helper-key:/run/sf-helper
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    pids_limit: 512
    stop_grace_period: 45s
    depends_on:
      helper:
        condition: service_started
        restart: true
      egress:
        condition: service_healthy
      reviewer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  reviewer:
    <<: [*image, *hardening]
    user: reviewer
    command: ["agent-host", "-mode", "review"]
    environment:
      HOME: /home/reviewer
      SF_WORKSPACE: /reviews
      SF_AGENT_HOST_LISTEN: ":8090"
      SF_AGENT_HOST_KEY_FILE: /reviews/.agent-host-key
      HTTPS_PROXY: http://egress-review:3128
      HTTP_PROXY: http://egress-review:3128
      https_proxy: http://egress-review:3128
      http_proxy: http://egress-review:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
      DISABLE_AUTOUPDATER: "1"
    networks:
      reviewnet:
        aliases: [reviewer]
    volumes:
      - reviews:/reviews:ro
      - type: volume
        source: agents
        target: /opt/software-factory/agents
        read_only: true
        volume:
          nocopy: true
      - reviewer-home:/home/reviewer
    tmpfs:
      - /tmp:size=1g,mode=1777
    mem_limit: 4g
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  helper:
    <<: [*image, *hardening]
    user: "10005:10005"
    group_add: ["${SF_DOCKER_GID:-0}"]
    command: ["box-helper"]
    environment:
      GOMEMLIMIT: 48MiB
      SF_HELPER_LISTEN: ":8099"
      SF_HELPER_KEY_FILE: /run/sf-helper/key
      SF_BOX_MEMORY: ${SF_BOX_MEMORY:-}
      SF_BOX_CPUS: ${SF_BOX_CPUS:-}
      SF_MAX_BOXES: ${SF_MAX_BOXES:-}
      SF_BOX_RUNTIME: ${SF_BOX_RUNTIME:-}
      SF_BOX_SUBNETS: ${SF_BOX_SUBNETS:-}
      SF_BOX_SWEEP_DRY: ${SF_BOX_SWEEP_DRY:-}
    volumes:
      - ${SF_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - helper-key:/run/sf-helper:ro
    networks:
      helpernet: {}
    mem_limit: 64m
    pids_limit: 64
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "--tlsv1.3", "--noproxy", "*", "-o", "/dev/null", "https://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

  egress:
    <<: [*image, *hardening]
    user: egress
    command: ["egress"]
    environment:
      <<: *egress-lists
      EGRESS_LISTEN: 0.0.0.0:3130
      EGRESS_REVIEW_LISTEN: egress-review:3128
      EGRESS_STATUS_LISTEN: egress-control:3129
      EGRESS_CONTROL_KEY_FILE: /run/sf-egress/control-key
      SF_BOX_SUBNETS: ${SF_BOX_SUBNETS:-}
    volumes:
      - egress-key:/run/sf-egress:ro
    networks:
      reviewnet:
        aliases: [egress-review]
      controlnet:
        aliases: [egress-control]
      outside: {}
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "--tlsv1.3", "--noproxy", "*", "-o", "/dev/null", "https://egress-control:3129/status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  reviewnet:
    internal: true
  controlnet:
    internal: true
  helpernet:
    internal: true
  outside: {}

volumes:
  engine-state:
  workspace:
  agents:
  reviews:
  reviewer-home:
  uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=320m,uid=10001,gid=10000,mode=0710
  egress-key:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=10001,gid=10003,mode=2750
  helper-key:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64k,uid=10001,gid=10005,mode=2750
