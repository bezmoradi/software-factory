- id: INST-011
  title: "A head of the tracked branch older than the engine's floor version is installed"
  edits:
    - file: "internal/adapters/install/npm/plugins.go"
      find: "\tcase review.Older(version, pl.Floor):\n"
      replace: "\tcase false:\n"
- id: INST-012
  title: "A plugin's agents are listed without the plugin's prefix"
  edits:
    - file: "internal/adapters/install/npm/plugins.go"
      find: "\t\t\tout = append(out, pl.ID+\":\"+name)"
      replace: "\t\t\tout = append(out, name)"
- id: INST-013
  title: "A version with no provenance passes though its pin names a source to check it against"
  edits:
    - file: "internal/adapters/install/npm/provenance.go"
      find: "\tcase !published:\n\t\tr.State = ProvenanceFailed"
      replace: "\tcase !published:\n\t\tr.State = ProvenanceNone"
- id: INST-014
  title: "The signed provenance isn't checked for the pinned tarball's sha512"
  edits:
    - file: "internal/adapters/install/npm/sigstore.go"
      find: "st.Subject[0].Name != subject || st.Subject[0].Digest[\"sha512\"] != digest {"
      replace: "st.Subject[0].Name != subject {"
- id: INST-015
  title: "The provenance certificate is checked at the current time instead of when the log recorded it"
  edits:
    - file: "internal/adapters/install/npm/sigstore.go"
      find: "CurrentTime: logged,"
      replace: "CurrentTime: time.Now(),"
- id: INST-016
  title: "The update check accepts an answer that isn't JSON by its content type"
  edits:
    - file: "internal/adapters/install/releases/releases.go"
      find: "if kind, _, err := mime.ParseMediaType(resp.Header.Get(\"Content-Type\")); err != nil || kind != \"application/json\" {"
      replace: "if _, _, err := mime.ParseMediaType(resp.Header.Get(\"Content-Type\")); err != nil {"
- id: INST-017
  title: "OSV lookups report only withdrawn advisories and drop live ones"
  edits:
    - file: "internal/adapters/install/osv/osv.go"
      find: "\t\t\tif d.Withdrawn != \"\" {"
      replace: "\t\t\tif d.Withdrawn == \"\" {"
- id: INST-018
  title: "OSV answers with fewer results than questions are accepted"
  edits:
    - file: "internal/adapters/install/osv/osv.go"
      find: "\tif len(out.Results) != len(queries) {"
      replace: "\tif len(out.Results) > len(queries) {"
- id: ENG-001
  title: "An ACP permission request for another session id is accepted"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "\tif c.sessionID == \"\" || p.SessionID != c.sessionID {"
      replace: "\tif c.sessionID == \"\" {"
- id: ENG-002
  title: "An ACP permission card shows the agent's allow_always option"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "if o.Kind == kindAllowAlways || (o.Kind == kindAllowOnce && !tool.Whole) {"
      replace: "if o.Kind == kindAllowOnce && !tool.Whole {"
- id: ENG-003
  title: "An answer naming the allow_always option is no longer refused"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "\t\tcase o.Kind == kindAllowAlways:\n\t\t\treturn \"\", false, ErrAllowAlways\n"
      replace: ""
- id: ENG-004
  title: "An allow naming an option is accepted for a tool call the engine can't see whole"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "\t\tcase a.Allow && !p.whole:\n\t\t\treturn \"\", false, ErrNotWhole\n"
      replace: ""
- id: ENG-005
  title: "An allow is accepted after the tool call's input changed since the card was shown"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "a.Allow && !rejected && (st == nil || st.version != p.version)"
      replace: "a.Allow && !rejected && st == nil"
- id: ENG-006
  title: "When an ACP request has no allow_once option an allow picks allow_always"
  edits:
    - file: "internal/adapters/engines/acp/permission.go"
      find: "\treturn firstOfKind(p.options, kindRejectOnce), true, nil"
      replace: "\treturn firstOfKind(p.options, kindAllowAlways), false, nil"
- id: ENG-007
  title: "Every ACP tool call counts as whole, even with no input"
  edits:
    - file: "internal/adapters/engines/acp/updates.go"
      find: "\t\tWhole:  st.input != nil,"
      replace: "\t\tWhole:  true,"
- id: ENG-008
  title: "A changed tool input no longer bumps the tool's version"
  edits:
    - file: "internal/adapters/engines/acp/updates.go"
      find: "\t\t\tst.version = c.inputSeq\n"
      replace: ""
- id: ENG-009
  title: "ACP session updates for another session id are accepted"
  edits:
    - file: "internal/adapters/engines/acp/updates.go"
      find: "\tif c.sessionID == \"\" || n.SessionID != c.sessionID {"
      replace: "\tif c.sessionID == \"\" {"
- id: ENG-010
  title: "The ACP protocol version the agent answers isn't checked"
  edits:
    - file: "internal/adapters/engines/acp/client.go"
      find: "if *r.ProtocolVersion != ProtocolVersion {"
      replace: "if *r.ProtocolVersion < 0 {"
- id: ENG-011
  title: "Cancelling an ACP turn leaves its permission cards pending"
  edits:
    - file: "internal/adapters/engines/acp/client.go"
      find: "\tc.cancelPermissionsLocked()\n\tc.cancelToolsLocked()\n\tc.note(\"cancel\")"
      replace: "\tc.cancelToolsLocked()\n\tc.note(\"cancel\")"
