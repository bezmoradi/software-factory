            "$.body.gate.reviewers[0].type": "knackpack:adversarial-reviewer"
            "$.body.gate.reviewers[1].type": "knackpack:slop-reviewer"
      - id: remove-while-running
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/packs"
          headers: { Origin: "${page.origin}" }
          body: { op: remove, path: /workspace/base/demo, digest: "${digest}" }
        expect:
          equal:
            "$.status": 409
            "$.body": { error: "in use", message: "A saved session runs the pack beta, and keeps it across Stop and Wake. Delete that session first." }
      - id: still-kept
        do: http.request
