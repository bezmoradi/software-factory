            "$.status": 200
            "$.body.entries[0].kind": pack
            "$.body.entries[0].result": used
            "$.body.entries[0].reason": "the developer picked knackpack, the built-in pack, to review demo on the page"
          none:
            "$.body.entries": { kind: pack, result: removed, hash: "${digest}" }
      - id: stop
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/stop-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
