  - id: PCK-003
    name: "An uploaded folder is kept as a pack of its own, with an engine-written plugin.json, and a second one with its name is refused; a session started on it records it, runs its steps and offers no Feature, keeps it after the project picks knackpack and across Stop and Wake, whose note names both packs, and holds the pack's removal until the session is deleted"
    steps:
      - id: upload
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/packs"
          headers: { Origin: "${page.origin}" }
          body: { op: upload, path: /workspace/base/demo, name: beta, files: [{ path: software-factory-pack.json, text: "{\"format\": \"software-factory-pack/1\", \"name\": \"beta\", \"version\": \"1.0.0\", \"roles\": {\"bug-hunter\": \"hunter\", \"simplicity\": \"trimmer\"}, \"steps\": {\"review\": \"/beta:handoff\"}}\n" }, { path: agents/hunter.md, text: "---\nname: hunter\ndescription: Finds bugs in the change\n---\nRead change.diff and the files it touches. Report each bug with its location.\n" }, { path: agents/trimmer.md, text: "---\nname: trimmer\ndescription: Finds what the change could drop\n---\nRead change.diff. Name what could be simpler.\n" }, { path: commands/handoff.md, text: "---\ndescription: Hand the work over\n---\nSay what changed and why.\n" }] }
        expect:
          equal:
            "$.status": 200
            "$.body.using": knackpack
            "$.body.packs[0].name": beta
            "$.body.packs[0].version": "1.0.0"
            "$.body.packs[0].digest": fc23c1888199af4b90323527b01b07d277290129951e50494ad8eb1842f556db
            "$.body.packs[0].sessionDigest": a98b266c5f250fb9c6a85cd3702c4ec92e2fc4369a1ba1a9401c54daddc77729
            "$.body.packs[0].source": { kind: upload, url: "", commit: "" }
            "$.body.packs[0].roles": { bug-hunter: hunter, simplicity: trimmer }
            "$.body.packs[0].steps": { review: "/beta:handoff" }
            "$.body.packs[0].documents": false
            "$.body.packs[0].agents": [hunter, trimmer]
            "$.body.packs[0].codeFiles": []
            "$.body.packs[0].usedBy": []
          matches: { "$.body.packs[0].addedAt": "[0-9]{13}" }
          absent: ["$.body.packs[1]"]
        save: { digest: "$.body.packs[0].digest" }
        waive: { EXE-09: "an upload only adds a pack: one with a name the engine keeps is refused with 409 name, one with the same digest is left as it is, and it changes no project's choice, so nothing can be removed or overwritten" }
      - id: upload-same-name
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/packs"
          headers: { Origin: "${page.origin}" }
          body: { op: upload, path: /workspace/base/demo, name: beta, files: [{ path: software-factory-pack.json, text: "{\"format\": \"software-factory-pack/1\", \"name\": \"beta\", \"version\": \"1.1.0\", \"roles\": {\"bug-hunter\": \"hunter\"}}\n" }, { path: agents/hunter.md, text: "---\nname: hunter\ndescription: Finds bugs in the change\n---\nRead change.diff and the tests.\n" }] }
        expect:
          equal:
            "$.status": 409
            "$.body": { error: name, message: "The engine already keeps a pack named beta. Remove it first, or use the one it keeps." }
        waive: { EXE-09: "an upload only adds a pack, and this one is refused with 409 name because the engine keeps a pack named beta, so nothing can be removed or overwritten" }
      - id: use-beta
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/packs"
          headers: { Origin: "${page.origin}" }
          body: { op: use, path: /workspace/base/demo, pack: "${digest}" }
        expect:
          equal:
            "$.status": 200
            "$.body.using": "${digest}"
            "$.body.packs[0].usedBy": [demo]
          absent: ["$.body.packs[1]"]
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "packs beta ${run.id}", type: fix }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
          any:
            "$.body.entries": [{ kind: pack, by: page, result: added, hash: "${digest}", commit: "", reason: "the developer uploaded the pack beta 1.0.0 (4 files), on the page" }, { kind: pack, by: page, result: used, hash: "${digest}", reason: "the developer picked the pack beta 1.0.0 to review demo on the page" }]
          none:
            "$.body.entries": { kind: pack, result: added, reason: "the developer uploaded the pack beta 1.1.0 (2 files), on the page" }
        save: { box: "$.body.entries[0].box" }
      - id: on-beta
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.adapter": beta
            "$.body.gate.commands": { review: "/beta:handoff" }
            "$.body.gate.catalog": "off"
            "$.body.gate.reviewers[0].type": "beta:hunter"
            "$.body.gate.reviewers[0].role": bug-hunter
            "$.body.gate.reviewers[1].type": "beta:trimmer"
            "$.body.gate.reviewers[1].role": simplicity
          absent: ["$.body.gate.reviewers[2]"]
          none:
            "$.body.gate.types": { id: feature }
      - id: use-knackpack
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/packs"
          headers: { Origin: "${page.origin}" }
          body: { op: use, path: /workspace/base/demo, pack: knackpack }
        expect:
          equal:
            "$.status": 200
            "$.body.using": knackpack
            "$.body.packs[0].usedBy": []
      - id: keeps-beta
