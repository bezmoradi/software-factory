  - id: EVS-090
    name: "The preview of a session's app (REQ-79): /api/preview refuses a session the engine doesn't know, offers the preview while the session runs (the listing's preview is empty), refuses a port outside the session's 10 with words that name its ports, answers a one-time code on the preview's own port with the session's 10 ports and the first as the default, and once the session is stopped the listing's preview and /api/preview's refusal give the same words"
    steps:
      - id: unknown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/preview"
