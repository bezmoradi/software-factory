  - id: EVS-019
    name: "A Code change session's typed messages that go as Define's command reach the open stream with the person's own words and the step they started, not the command (the owner's decision REQ-55 of 2026-11-26): each carries step define and the engine's label Started Define, while the agent still gets Define's command, which the fake shows by writing the brief from the lines after the command's own; a page reload's replay of the session's events shows both again with the same words and label; once the brief is there, a message goes as typed and its frame carries no step; the frames are read after the session is removed, so a failed read leaves no session behind"
    steps:
      - id: open
        do: http.open
        identity: page
        as: events
        with:
          path: "/api/events"
          headers: { Origin: "${page.origin}" }
        expect:
          equal: { "$.status": 200, "$.open": true, "$.format": ndjson }
      - id: hello
        do: http.frames
        on: events
        eventually: { within: 5s, every: 100ms }
        expect:
          equal:
            "$.frames[0].json.type": hello
            "$.frames[0].json.sessions": []
          present: ["$.frames[0].json.stream"]
        save: { stream: "$.frames[0].json.stream" }
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "proctor define ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: defaulted
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": false
            "$.body.gate.workType": change
            "$.body.gate.requirements": null
      - id: question
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: Which orders, and for whom? ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: request
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "Export the orders\nfor managers ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: defined
        do: http.request
        identity: page
        eventually: { within: 60s, every: 500ms }
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.requirements.path": "/workspace/s/${box}/docs/${sid}/REQUIREMENTS.md"
            "$.body.gate.requirements.text": "for managers ${run.id}\n"
      - id: reload
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/replay"
          headers: { Origin: "${page.origin}" }
          body: { stream: "${stream}", sid: "${sid}", since: 0 }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
        no_state_check: "no page read shows a replay, which sends the session's events again on this stream only, as a page reload asks; the agent handles it before the marker message sent next, and labelled, after the session is removed, counts each labelled message twice, once as it happened and once from this replay"
      - id: marker
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: define after ${run.id}\ncommit: define-${run.id}.txt" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: marker-landed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/file-check"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", paths: ["define-${run.id}.txt"] }
        eventually: { within: 60s, every: 500ms }
        expect:
          equal:
            "$.status": 200
            "$.body": { found: ["define-${run.id}.txt"] }
      - id: stop
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/stop-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: stopped
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        eventually: { within: 30s, every: 500ms }
        expect:
          equal:
            "$.status": 200
          any:
            "$.body.entries": { kind: session-stop, by: page, result: stopped, session: "${sid}", branch: "sf/${id}" }
      - id: remove
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/remove-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
      - id: gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 409
            "$.body": { error: "not started here", message: "Only a session this engine started has an audit view here." }
      - id: labelled
        do: http.frames
        on: events
        expect:
          equal: { "$.overflow": false }
          any:
            "$.frames":
              - { json.type: prompt, json.sid: "${sid}", json.from: page, json.text: "Export the orders\nfor managers ${run.id}", json.step: define, json.started: Started Define }
              - { json.type: prompt, json.sid: "${sid}", json.from: page, json.text: "say: define after ${run.id}\ncommit: define-${run.id}.txt" }
          count:
            "$.frames": { where: { json.type: prompt, json.sid: "${sid}", json.from: page, json.step: define, json.started: Started Define }, is: 4 }
      - id: no-command-shown
        do: http.frames
        on: events
        consistently: { for: 1s, every: 200ms }
        expect:
          none:
            "$.frames":
              - { json.type: prompt, json.sid: "${sid}", json.text: "/knackpack:challenge-requirements Export the orders\nfor managers ${run.id}" }
              - { json.type: prompt, json.sid: "${sid}", json.text: "say: define after ${run.id}\ncommit: define-${run.id}.txt", json.step: define }
