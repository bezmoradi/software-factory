  - id: SEC-T04R
    name: "A POST route refuses a cross-site fetch, even with the page key (routes that only read)"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}", Sec-Fetch-Site: cross-site }
      body: {}
    expect:
      equal:
        "$.status": 403
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.headers.x-content-type-options": ["nosniff"]
        "$.headers.x-frame-options": ["DENY"]
        "$.headers.referrer-policy": ["no-referrer"]
        "$.headers.cache-control": ["no-store"]
        "$.body": { error: site, message: "The engine takes requests only from its own page, not from another site." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.headers.access-control-allow-origin"]
    covers: cross_site
    columns: ["case", "route"]
    rows:
      - ["t04r_agent_report", "/api/agent-report"]
      - ["t04r_audit", "/api/audit"]
      - ["t04r_backup", "/api/backup"]
      - ["t04r_changes", "/api/changes"]
      - ["t04r_docs", "/api/docs"]
      - ["t04r_file", "/api/file"]
      - ["t04r_file_check", "/api/file-check"]
      - ["t04r_gate", "/api/gate"]
      - ["t04r_metrics", "/api/metrics"]
      - ["t04r_projects", "/api/projects"]
      - ["t04r_review_reply", "/api/review-reply"]
      - ["t04r_screenshot", "/api/screenshot"]
      - ["t04r_screenshots", "/api/screenshots"]
      - ["t04r_session_name", "/api/session-name"]

  - id: SEC-T05
    name: "A POST route refuses a request with no Origin, even with the page key"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      body: {}
    expect:
      equal:
        "$.status": 403
        "$.headers.content-type": ["application/json; charset=utf-8"]
