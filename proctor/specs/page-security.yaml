  - id: SEC-T12
    name: "A POST route refuses PUT, DELETE and PATCH with no Origin, even with the page key, so another method can't skip the POST-only Origin check"
    do: http.request
    identity: page
    with:
      method: "${row.method}"
      path: "${row.route}"
      body: { proctorUnknownField: true }
    expect:
      equal:
        "$.status": 405
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.headers.x-content-type-options": ["nosniff"]
        "$.headers.x-frame-options": ["DENY"]
        "$.headers.referrer-policy": ["no-referrer"]
        "$.headers.cache-control": ["no-store"]
        "$.body": { error: method, message: "The engine doesn't take that method on this route." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.headers.access-control-allow-origin"]
    no_state_check: "refused with 405 before the route's handler runs, since the route takes only POST, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    waive:
      EXE-09:
        reason: "PUT, DELETE and PATCH count as destructive on every route, and each row, which sends no Origin, is refused with 405 before the route's handler runs, since the route takes only POST; its body holds only a field no route takes, which names no repository, session or other record, so nothing can be removed or overwritten; every row is named, since a waived row guards no later row on its route"
