scenarios:
  - id: SEC-001
    name: "A POST to a path under /api/ that names no route is refused, even with the page key"
    steps:
      - id: unknown-route
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/proctor-unknown"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the path names no route, so no handler ran and there is no state of that route to read back"

  - id: SEC-002
    name: "A path outside /api/ that isn't the page or its files is refused"
    steps:
      - id: unknown-path
        do: http.request
        identity: page
        with:
          method: GET
          path: "/proctor-unknown"
          headers: { Origin: "${page.origin}" }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }

  - id: SEC-003
    name: "A CORS preflight from another site gets no grant"
    steps:
      - id: preflight
        do: http.request
        identity: anonymous
        with:
          method: OPTIONS
          path: "/api/projects"
          headers: { Origin: "https://proctor.invalid", Access-Control-Request-Method: POST, Access-Control-Request-Headers: "authorization, content-type" }
        expect:
          equal:
            "$.status": 403
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: origin, message: "The engine takes requests only from its own page. Open the page at its own address." }
          absent: ["$.headers.access-control-allow-origin", "$.headers.access-control-allow-methods", "$.headers.access-control-allow-headers"]

  - id: SEC-004
    name: "A same-origin preflight gets no grant either, since the page needs none and answers only POST"
    steps:
      - id: preflight-same-origin
        do: http.request
        identity: anonymous
        with:
          method: OPTIONS
          path: "/api/projects"
          headers: { Origin: "${page.origin}", Access-Control-Request-Method: POST }
        expect:
          equal:
            "$.status": 405
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: method, message: "The engine doesn't take that method on this route." }
          absent: ["$.headers.access-control-allow-origin", "$.headers.access-control-allow-methods"]

  - id: SEC-005
    name: "Each answer carries one X-SF-Request of 16 lowercase hex digits, a new one on each request"
    steps:
      - id: first-read
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        save: { first_request: "$.headers.x-sf-request[0]" }
      - id: second-read
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
          differs: { "$.headers.x-sf-request[0]": "${first_request}" }

  - id: SEC-006
    name: "The removed Disconnect route is refused as a path that names no route, even with the page key; its body holds only a field no route takes, so a Disconnect that came back would refuse it with 400 fields before ending the run's key"
    steps:
      - id: disconnect-gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/disconnect"
          headers: { Origin: "${page.origin}" }
          body: { proctorUnknownField: true }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the path names no route, so no handler ran and there is no state of that route to read back"
  - id: SEC-007
    name: "The removed agent-models and hand-over routes are refused as paths that name no route, even with the page key, and Network access's removed agents op is refused as an op the egress route doesn't take; each body holds only what the old route took or a field no route takes, so a route that came back would answer otherwise"
    steps:
      - id: agent-models-gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/agent-models"
          headers: { Origin: "${page.origin}" }
          body: { op: read, agent: claude }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the path names no route, so no handler ran and there is no state of that route to read back"
      - id: handover-gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/handover"
          headers: { Origin: "${page.origin}" }
          body: { proctorUnknownField: true }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the path names no route, so no handler ran and there is no state of that route to read back"
      - id: egress-agents-op-gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/egress"
          headers: { Origin: "${page.origin}" }
          body: { op: agents, agents: [claude] }
        expect:
          equal:
            "$.status": 400
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: op, message: "That op isn't one this route takes. Reload the page and try again." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the egress route refuses an op it doesn't take before it reads or changes the allowlist, so there is no change to read back"
  - id: SEC-008
    name: "The removed pair route, which started two sessions on one task, is refused as a path that names no route, even with the page key; its body holds only a field no route takes, so a pair route that came back would refuse it with 400 fields"
    steps:
      - id: pair-gone
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/pair"
          headers: { Origin: "${page.origin}" }
          body: { proctorUnknownField: true }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: route, message: "The engine has no such route." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
        no_state_check: "the path names no route, so no handler ran and there is no state of that route to read back"
