  - id: SEC-T13
    name: "A POST route refuses a same-site fetch, even with the page key"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}", Sec-Fetch-Site: same-site }
      body: { proctorUnknownField: true }
    expect:
      equal:
        "$.status": 403
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.headers.x-content-type-options": ["nosniff"]
        "$.headers.x-frame-options": ["DENY"]
        "$.headers.referrer-policy": ["no-referrer"]
        "$.headers.cache-control": ["no-store"]
        "$.body": { error: site, message: "The engine takes requests only from its own page, not from another site." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.headers.access-control-allow-origin"]
    no_state_check: "refused with 403 before the route's handler runs, since Sec-Fetch-Site is same-site, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    waive: { EXE-09: { rows: [t13_remove_repo, t13_remove_session, t13_packs], reason: "the remove-repo, remove-session and packs rows send only a field no route takes, which names no repository, session or pack, and every row is refused with 403 before the route's handler runs, since Sec-Fetch-Site is same-site, so nothing can be removed" } }
