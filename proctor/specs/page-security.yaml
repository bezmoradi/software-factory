version: 2
suite: page-security
tables:
  - id: SEC-T01
    name: "A POST route without the page key is refused before its handler, with no why, since no key was presented"
    do: http.request
    identity: anonymous
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: {}
    expect:
      equal:
        "$.status": 401
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.headers.x-content-type-options": ["nosniff"]
        "$.headers.x-frame-options": ["DENY"]
        "$.headers.referrer-policy": ["no-referrer"]
        "$.headers.cache-control": ["no-store"]
        "$.body": { error: token, message: "The page's key is missing or isn't one the engine issued. Reload the page to sign in." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.headers.access-control-allow-origin", "$.body.why"]
    no_state_check: "refused with 401 before the route's handler runs, since the request carries no key, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    waive: { EXE-09: { rows: [t01_remove_repo, t01_remove_session, t01_packs], reason: "the remove-repo, remove-session and packs rows send an empty body, which names no repository, session or pack, and every row is refused with 401 before the route's handler runs, since the request carries no key, so nothing can be removed" } }
    covers: no_key
    columns: ["case", "route"]
    rows:
      - ["t01_add_repo", "/api/add-repo"]
      - ["t01_allow_commit", "/api/allow-commit"]
      - ["t01_allow_file", "/api/allow-file"]
      - ["t01_allow_rules", "/api/allow-rules"]
      - ["t01_answer", "/api/answer"]
