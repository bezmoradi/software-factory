  - id: SEC-T02
    name: "A POST route under another Host name, as DNS rebinding would send it, is refused as misdirected, even with the page key"
    do: http_misdirected.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: {}
    expect:
      equal:
        "$.status": 421
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.headers.x-content-type-options": ["nosniff"]
        "$.headers.x-frame-options": ["DENY"]
        "$.headers.referrer-policy": ["no-referrer"]
        "$.headers.cache-control": ["no-store"]
        "$.body": { error: host, message: "The engine answers only at the address it serves the page on. Open the page at that address." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.headers.access-control-allow-origin"]
    no_state_check: "refused with 421 before any other check, since the Host isn't 127.0.0.1 and the page's port, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    waive: { EXE-09: { rows: [t02_remove_repo, t02_remove_session, t02_packs], reason: "the remove-repo, remove-session and packs rows send an empty body, which names no repository, session or pack, and every row is refused with 421 before any other check, since the Host isn't 127.0.0.1 and the page's port, so nothing can be removed" } }
    covers: other_host
    columns: ["case", "route"]
