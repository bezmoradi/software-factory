version: 2
suite: credentials
tables:
  - id: CRD-T01
    name: "A credential that isn't the page's key, in each form, or the page's key under another scheme than Bearer, is refused with no why, since this engine never issued the key or the header isn't a Bearer key"
    do: http.request
    identity: page
    variant: "${row.variant}"
    with:
      method: POST
      path: "/api/projects"
      headers: { Origin: "${page.origin}" }
      body: {}
    expect:
      equal:
        "$.status": 401
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: token, message: "The page's key is missing or isn't one the engine issued. Reload the page to sign in." }
      present: ["$.headers.x-sf-request"]
      matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
      absent: ["$.headers.x-sf-request[1]", "$.body.why"]
    columns: ["case", "variant"]
    rows:
      - ["never_issued_key", "unknown"]
      - ["basic_scheme", "basic_scheme"]
      - ["token_scheme", "token_scheme"]
      - ["key_without_scheme", "no_scheme"]

scenarios:
  - id: CRD-001
    name: "The page's key reads the project list"
    steps:
      - id: projects
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body.repos": true
          any:
            "$.body.projects": { path: /workspace/base/demo, name: demo, url: "https://gitserver.test:8443/dev/demo.git", branch: main }
            "$.body.hosts": { host: "https://gitserver.test:8443" }

  - id: CRD-002
    name: "The key's scheme name is matched without regard to case"
    steps:
      - id: projects-lowercase-scheme
        do: http.request
        identity: page
        variant: lowercase_scheme
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
            "$.body.repos": true
          any:
            "$.body.projects": { path: /workspace/base/demo, name: demo }

  - id: CRD-003
    name: "A key a newer sign-in replaced is refused with why replaced, and the page's key that replaced it keeps working"
    steps:
      - id: replaced-key
        do: http.request
        identity: page
        variant: replaced
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 401
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: token, why: replaced, message: "The page signed in again in another tab or browser, which ended this tab's key. Reload the page to use it here." }
          present: ["$.headers.x-sf-request"]
          matches: { "$.headers.x-sf-request[0]": "[0-9a-f]{16}" }
          absent: ["$.headers.x-sf-request[1]"]
      - id: key-still-works
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/projects"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
            "$.body.repos": true
