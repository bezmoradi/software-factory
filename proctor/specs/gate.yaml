    name: "A push the engine refuses for the workflow documents it carries lists no developer's decision on those documents, since neither the person's Allow nor an allowed file changes the refusal (T-25): in an Explore session, a commit of .knackpack/t-*/credentials.md and one of src/credentials-*.txt, both named like files that hold secrets, make /api/gate list the decision on the source file, then the refusal naming the document, then the Explore type's own item, and no decision on the document, which sorts before the source file and would come first; its flagged list holds the source file only"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
