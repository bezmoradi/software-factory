    name: "A Code change always gets a plan (the owner's decision REQ-64 of 2026-11-26): before Define runs, Define is the current step and reads Now, and the step card says Define, Step 1 of 5, with the first of five segments half filled; Approve requirements with a plan field, true or false, is refused with 400 fields, since the route takes no plan choice, and approves nothing; without it the requirements are approved and the engine sends the Plan step, whose plan the fake writes as PLAN.md in the session's documents folder, so Define reads Done, Plan waits for the person's approval, the gate waits for the plan's approval and lists it as missing; a Write before the plan is approved is held with the reason that the plan needs the developer's approval, and writes nothing; once the plan is approved, the agent's push on the implement text the engine sends is held for work committed on the approved plan and the two reviews, and the same kind of Write lands; the branch has no commit at all"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
