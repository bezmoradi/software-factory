          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": incident
