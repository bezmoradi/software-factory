  - id: GATE-006
    name: "An Incident session: the gate offers and reports the Incident type with no root cause, refuses an approval while the session's documents folder holds no root cause (409 nothing), reads ROOT-CAUSE.md from that folder, where the fake writes each step's diagnosis without committing it (REQ-49), as the session's plan document, refuses to approve it until its Status is CONFIRMED, and then approves it; the gate view has no effective type; Write the incident review is refused with 409 step while the approved root cause has no fix committed on it, and once the fix the engine asks for is committed, Push offers it; the branch then holds the fix and no commit of the root cause"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: incident }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
