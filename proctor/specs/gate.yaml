        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.workType": incident
            "$.body.gate.size": incident
            "$.body.gate.planDoc": null
            "$.body.gate.waiting": "approve the root cause first"
          absent: ["$.body.gate.effective"]
