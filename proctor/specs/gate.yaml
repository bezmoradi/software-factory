  - id: GATE-010
    name: "Approve and implement in a Code change session (the event stream is read once, before Add a plan, to wait for the engine's read of the worktree after the turn): Approve requirements without saying whether a plan follows is refused with 400 fields naming plan and approves nothing; with plan false the requirements are approved and the audit line says without a plan, Plan shows Skipped, the gate waits only for work committed since the requirements were approved, and the session offers Add a plan; the agent's push on the implement text the engine sends is held for work committed on the approved requirements and the two reviews, with no plan in it; a write the gate held before now lands; while that work is uncommitted Add a plan is refused with 409 work, and once work is committed on the approved requirements the gate waits for nothing more and the push needs only the two reviews, the plan switch is gone, and Add a plan is refused with 409 built"
