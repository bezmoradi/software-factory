  - id: GATE-016
    name: "Define starts itself (the owner's decision REQ-29 of 2026-11-26): a session nobody picks a work type for has no chosen type, its effective type is the built-in default, Code change, and its Define hasn't run, and its typed messages still go as Define's command; a typed message too long to carry Define's command is refused with 400 text saying how much to cut, and Define stays not run; a question goes as Define's command, the fake answers it without a brief, and the path offers Continue defining; the request after it, with an attached file, goes as Define's command too, with the file's note after the text, so the fake writes the brief from it in the session's documents folder, committing nothing, and the path shows no notice, since no file in the worktree changed; once the brief is in that folder, a typed message with a file goes as typed, so the brief stays as it was, and the branch's only commit is the script's own"
    steps:
      - id: start
        do: http.request
