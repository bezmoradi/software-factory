  - id: GATE-004
    name: "A Code change session before any approval: the person's first typed message goes to the agent as Define's command followed by the engine's notes and the text, which the fake answers by committing the lines after the command's line as .knackpack/fake-feature/REQUIREMENTS.md: the note that the developer set Code change, with its rules, then the text as typed, and the next message goes as typed, so the fake runs its script and the requirements stay as they were; /check holds every write, documentation included, with the Code change hold's whole reason, the fake writes neither file and the hold isn't counted, while a protected path and a push in the same turn are still refused and counted, the lowercase tool name write isn't held, and a shell write lands"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: change }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": change
      - id: first-message
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "Export the orders\nOnly a manager's own organization" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: first-defined
        do: http.request
        identity: page
        eventually: { within: 60s, every: 500ms }
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.requirements.path": ".knackpack/fake-feature/REQUIREMENTS.md"
            "$.body.gate.requirements.approved": false
          matches:
            "$.body.gate.requirements.text": "\n\\[Software Factory\\] The developer set this session's work type to Code change on the software factory page: the developer approves the requirements, and chooses whether a plan follows, on the page before you change files other than knackpack's own; the engine sends you the next step after each approval\\.\n\nExport the orders\nOnly a manager's own organization\n"
            "$.body.gate.requirements.hash": "[0-9a-f]{64}"
        save: { reqhash: "$.body.gate.requirements.hash" }
      - id: second-message
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: gate feature ${run.id}\ntry: f_src src/feature-${run.id}.txt\ntry: f_docs docs/feature-${run.id}.md\ntry: f_protected .codex/config.toml\ntry-run: f_push git push\ntry-tool: f_tool_case write {\"file_path\":\"src/lower-${run.id}.txt\",\"content\":\"x\"}\nwrite: feature-control-${run.id}.txt" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: feature-asked
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/file-check"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", paths: ["gate-answers/f_tool_case.txt"] }
        eventually: { within: 60s, every: 500ms }
        expect:
          equal:
            "$.status": 200
            "$.body": { found: ["gate-answers/f_tool_case.txt"] }
      - id: stop
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/stop-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: box-gone
        do: docker.container
        with: { name: "sf-proctor-box-${box}" }
        eventually: { within: 30s, every: 1s }
        expect:
          equal: { "$.found": false }
      - id: stopped
