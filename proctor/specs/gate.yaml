          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", path: "gate-answers/w_agents_skill.json" }
        expect:
          equal:
            "$.status": 200
            "$.body": { path: "gate-answers/w_agents_skill.json", text: "{\"cloud\":\"\",\"guarded\":\"\",\"held\":\"\",\"irreversible\":false,\"kind\":\"edit\",\"protected\":\"it is a settings folder other coding tools read in the worktree, which can decide what runs when one of them starts here\",\"pushes\":false,\"waits\":false}\n" }
