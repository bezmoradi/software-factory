  - id: GATE-004
    name: "A Code change session before any approval: the person's first typed message goes to the agent as Define's command followed by the engine's notes and the text, which the fake answers by writing the lines after the command's line as REQUIREMENTS.md in the session's documents folder, which $SF_DOCS names and /api/gate's docsFolder shows, and committing nothing: the note that the developer set Code change, with its rules, then the text as typed, and the next message goes as typed, so the fake runs its script and the requirements stay as they were; /check holds every write, documentation included, with the Code change hold's whole reason, which names that folder as the place for the brief, the plan and the root cause (REQ-49), the fake writes neither file and the hold isn't counted, while a protected path and a push in the same turn are still refused and counted, the lowercase tool name write isn't held, and a shell write lands; the session's branch has no commit at all, so the brief was never committed"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: change }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
