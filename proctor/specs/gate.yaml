        expect:
          equal:
            "$.status": 200
            "$.body": { path: "gate-answers/f_src.json", text: "{\"cloud\":\"\",\"guarded\":\"\",\"held\":\"src/feature-${run.id}.txt can't change yet: the requirements, and then the plan if the developer chooses one, need the developer's approval on the software factory page first. In a Code change the developer approves the requirements first, and chooses there whether a plan follows, which they then approve too, before Implement. Until then only this step's own files can change: .knackpack/*/REQUIREMENTS.md, .knackpack/feature.json. Don't make the change another way, such as through a shell command: the gate checks the working tree when the plan is approved and before every push.\",\"irreversible\":false,\"kind\":\"edit\",\"protected\":\"\",\"pushes\":false,\"waits\":false}\n" }
