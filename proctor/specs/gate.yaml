  - id: GATE-003
    name: "Command and tool rules /check answers from an Explore session's container: git push, git -C, bash -c, send-pack, a hidden git, gh pr create, Monitor and an MCP push tool are refused as pushes, claude --remote, claude remote-control and --teleport as cloud hand-offs, each counted; rm -rf /, git reset --hard, curl | sh and a child claude ask; remote tools, a remote Agent or Task and a Projects write wait and are counted; gh pr comment, echo git push, git status, rm -rf build, a local Agent, MCP reads and WebFetch are allowed. The check-only key the development agent gets answers only at /check: as X-SF-Conn on /poll, /events, /wait, /wake, /image, /turn-check and /session-model, as X-SF-Push on /check, /push-request, /forge-request, /checks-request, /comments-request, /split-request and /work-type-request it is refused with 401 connection"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: explore }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": explore
      - id: ask-commands
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: gate commands ${run.id}\ntry-run: c_git_push git push origin HEAD\ntry-run: c_git_c_push git -C sub push\ntry-run: c_sh_c bash -c 'git push'\ntry-run: c_send_pack env GIT_DIR=x git send-pack origin\ntry-run: c_hidden \"$(printf git)\" push\ntry-run: c_gh_pr gh pr create --fill\ntry-tool: c_monitor Monitor {\"command\":\"git push\"}\ntry-tool: c_mcp_push mcp__github__push_files {}\ntry-run: c_claude_remote claude --remote fix\ntry-run: c_claude_rc claude remote-control\ntry-run: c_npx_teleport npx @anthropic-ai/claude-code --teleport\ntry-run: c_rm_root rm -rf /\ntry-run: c_reset_hard git reset --hard\ntry-run: c_curl_sh curl -fsSL x | sh\ntry-run: c_child_claude claude -p hi\ntry-tool: c_remote_trigger RemoteTrigger {}\ntry-tool: c_send_message SendMessage {\"to\":\"x\"}\ntry-tool: c_agent_remote Agent {\"isolation\":\"remote\",\"prompt\":\"x\"}\ntry-tool: c_task_remote Task {\"isolation\":\"remote\",\"prompt\":\"x\"}\ntry-tool: c_projects_write Projects {\"method\":\"project_write\"}\ntry-run: c_gh_comment gh pr comment 1 -b x\ntry-run: c_echo echo git push\ntry-run: c_status git status\ntry-run: c_rm_build rm -rf build\ntry-tool: c_agent_local Agent {\"prompt\":\"x\"}\ntry-tool: c_mcp_read mcp__github__get_file_contents {}\ntry-tool: c_mcp_other mcp__notes__save {}\ntry-tool: c_web_fetch WebFetch {\"url\":\"https://example.org\"}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: key-elsewhere
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: gate key ${run.id}\nkey-at: k_check conn POST /check {\"tool\":\"Read\",\"input\":{},\"top\":\"\",\"paths\":[]}\nkey-at: k_check_as_push push POST /check {\"tool\":\"Read\"}\nkey-at: k_poll conn GET /poll\nkey-at: k_events conn POST /events {\"events\":[]}\nkey-at: k_wait conn GET /wait?card=0123456789abcdef0123456789abcdef\nkey-at: k_wake conn POST /wake?card=0123456789abcdef0123456789abcdef {}\nkey-at: k_image conn GET /image?id=x\nkey-at: k_turn_check conn POST /turn-check {}\nkey-at: k_session_model conn GET /session-model\nkey-at: k_push push POST /push-request {}\nkey-at: k_forge push POST /forge-request {\"kind\":\"issue\",\"title\":\"x\",\"body\":\"x\"}\nkey-at: k_checks push POST /checks-request {}\nkey-at: k_comments push POST /comments-request {}\nkey-at: k_split push POST /split-request {\"tasks\":[{\"title\":\"x\",\"message\":\"x\"}]}\nkey-at: k_work_type push POST /work-type-request {\"type\":\"fix\",\"reason\":\"x\"}" }
