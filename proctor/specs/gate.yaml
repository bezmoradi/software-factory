version: 2
suite: gate
scenarios:
  - id: GATE-001
    name: "The fake agent's Write, Edit, MultiEdit and NotebookEdit calls ask /check from an Explore session's container as Claude Code's plugin does; every path the write check protects (.agents and .codex as any segment, in any case, after .. and repeated slashes, as an absolute path, and through the real path of a linked folder; .env as the last segment in any case) is refused, counted once each and not written, and writes that leave .agents, sit in a sibling folder that only starts with the worktree's name, or are outside the worktree aren't protected"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: explore }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": explore
      - id: ask-protected
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: gate protected ${run.id}\nmkdir: .agents/skills\nlink: agents-link -> .agents\ntry: w_agents_skill .agents/skills/gw/SKILL.md\ntry: w_agents_plugins .agents/plugins/marketplace.json\ntry: w_agents_nested src/.agents/x.md\ntry: w_agents_itself .agents\ntry: w_codex_config .codex/config.toml\ntry: w_codex_nested sub/.codex/config.toml\ntry: w_env .env\ntry: w_env_nested web/.env\ntry: w_case_agents .AGENTS/x\ntry: w_case_codex .Codex/config.toml\ntry: w_case_env .ENV\ntry: w_dotdot_in src/../.agents/x\ntry: w_dot_slashes ./.codex//config.toml\ntry: w_absolute /workspace/s/${box}/worktrees/sf-${id}/.codex/abs.toml\ntry: w_link_dir agents-link/x.md\ntry-tool: e_codex Edit {\"file_path\":\".codex/a\",\"old_string\":\"\",\"new_string\":\"\\n\"}\ntry-tool: e_multi MultiEdit {\"file_path\":\".agents/a\",\"edits\":[]}\ntry-tool: e_notebook NotebookEdit {\"notebook_path\":\".codex/n.ipynb\",\"new_source\":\"x\"}\ntry: w_dotdot_out .agents/../src/gw-${run.id}.txt\ntry: w_sibling ../sf-${id}x/.agents/a\ntry: w_escape ../sf-other/.agents/x\ntry: w_home /home/agent/.codex/config.toml\ntry: w_allowed gw-${run.id}.txt\ntry-tool: e_allowed Edit {\"file_path\":\"gw-${run.id}.txt\",\"old_string\":\"\",\"new_string\":\"\\n\"}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: protected-asked
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/file-check"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", paths: ["gate-answers/e_allowed.txt"] }
        eventually: { within: 60s, every: 500ms }
        expect:
          equal:
            "$.status": 200
            "$.body": { found: ["gate-answers/e_allowed.txt"] }
      - id: stop
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/stop-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 202
            "$.body": { ok: true }
      - id: box-gone
        do: docker.container
        with: { name: "sf-proctor-box-${box}" }
        eventually: { within: 30s, every: 1s }
        expect:
          equal: { "$.found": false }
      - id: stopped
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        eventually: { within: 30s, every: 500ms }
        expect:
          equal:
            "$.status": 200
          any:
            "$.body.entries": { kind: session-stop, by: page, result: stopped, session: "${sid}", branch: "sf/${id}" }
      - id: network-gone
        do: docker.network
        with: { name: "sf-proctor-box-${box}" }
        eventually: { within: 30s, every: 1s }
        expect:
          equal: { "$.found": false }
