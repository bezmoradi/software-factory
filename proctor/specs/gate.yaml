    name: "Command and tool rules /check answers from a Fix session's container: git push, git -C, bash -c, send-pack, a hidden git, gh pr create, Monitor and an MCP push tool are refused as pushes, claude --remote, claude remote-control and --teleport as cloud hand-offs, each counted; rm -rf /, git reset --hard, curl | sh and a child claude ask; remote tools, a remote Agent or Task and a Projects write wait and are counted; gh pr comment, echo git push, git status, rm -rf build, a local Agent, MCP reads and WebFetch are allowed. The check-only key the development agent gets answers only at /check: as X-SF-Conn on /poll, /events, /wait, /wake, /image, /turn-check and /session-model, as X-SF-Push on /check, /push-request, /forge-request, /checks-request, /comments-request and /split-request it is refused with 401 connection"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
