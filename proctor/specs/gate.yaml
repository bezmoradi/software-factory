    name: "A task for another repository that is in Projects already (the owner's decision REQ-05 of 2026-11-26): factory_split refuses a project address with a query or a fragment, with Add repository's words, and agent-host refuses a blank one before it reaches the engine; the card shows the address and the project's name in Projects, and the person's Start, with the goal session stopped (a stopped goal still starts its cards), starts the session there at once, as a task of the goal, with the card's text as its first message; the task session stops before the goal session is deleted, so the goal's container, which its delete wakes, never runs beside the task's"
