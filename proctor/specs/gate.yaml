  - id: GATE-002
    name: "Pinned answers of the write check. Refused and counted: a dangling link to .env, a link to a folder not there yet with .env inside it, and a two-link chain ending at .env (each link is followed to where the write lands), .env.local, .env.example, .env.production, sub/.env.local, .envrc and .ENVRC (an environment file by its own name), the worktree's .git file, .git/hooks, .git/config and sub/.git/config, and the session clone's .git/config by its absolute path and through a link out of the worktree (git's own metadata, wherever it is). A .. after a missing folder or after a link to a folder outside the worktree doesn't hide a link to .env or .git: missing/../env-link, missing/a/../../env-link, missing/../git-link and out-link/../env-link are refused, as is src/../env-link (the plugin walks the path as given and as folded, each through its links). A path starting ~/ is placed under the home folder, as Claude Code places it: ~/../../workspace/s/<box>/worktrees/sf-<id>/.env is refused and counted, and ~/notes.txt is allowed and not written, since it is outside the worktree. A path with white space around it is placed both as written and trimmed, as Claude Code trims it: \" .env\", \".env \" and a tab before .agents/x are refused and counted. Refused without asking and not counted: a link loop, since where the write lands can't be told. Allowed and not counted: a folder named .env (the rule is about the file's own name), .claude/settings.json and CLAUDE.md (left to the start-up approval), proctor/, PROCTOR/, the root Makefile and GNUmakefile (guarded only once main or the branch holds proctor/proctor.yaml, which this project doesn't), %2eagents, a Cyrillic .аgents, agents and .agents.bak, a Write with no path, the lowercase tool name write, Read, and a Bash redirect into .agents (shell writes aren't checked). /api/file-check then names what is there but isn't read in unread: the links env-link, chain-a, loop-a, out-link and clone-config as link, none followed, web/.env/x and .claude/settings.json, which landed, as secret, and newdir-link/.env, a secret name through a link, as secret, the reason /api/file gives first; the missing .env and missing-<run>.txt are in neither found nor unread"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "gate ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
            "$.body.entries[0].session": "${sid}"
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: explore }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": explore
      - id: ask-pinned
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/message"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", text: "say: gate pinned ${run.id}\nlink: env-link -> .env\ntry: w_dangling_env env-link\ntry: w_env_local .env.local\ntry: w_envrc .envrc\ntry: w_env_folder web/.env/x\ntry: w_git_hook .git/hooks/pre-commit\ntry: w_git_config .git/config\ntry: w_git_file .git\ntry: w_git_nested sub/.git/config\ntry: w_env_example .env.example\ntry: w_env_production .env.production\ntry: w_env_local_nested sub/.env.local\ntry: w_case_envrc .ENVRC\nlink: newdir-link -> newdir\ntry: w_link_newdir newdir-link/.env\nlink: chain-a -> chain-b\nlink: chain-b -> .env\ntry: w_link_chain chain-a\nlink: loop-a -> loop-b\nlink: loop-b -> loop-a\ntry: w_link_loop loop-a\nmkdir: src\nlink: git-link -> .git\nlink: out-link -> /tmp\ntry: w_dotdot_missing missing/../env-link\ntry: w_dotdot_missing_deep missing/a/../../env-link\ntry: w_dotdot_missing_git missing/../git-link\ntry: w_dotdot_out_link out-link/../env-link\ntry: w_dotdot_src src/../env-link\nlink: clone-config -> ../../repos/demo/.git/config\ntry: w_clone_git /workspace/s/${box}/repos/demo/.git/config\ntry: w_clone_git_link clone-config\ntry: w_home_env ~/../../workspace/s/${box}/worktrees/sf-${id}/.env\ntry: w_home_notes ~/notes.txt\ntry-tool: w_space_env Write {\"file_path\":\" .env\",\"content\":\"x\"}\ntry-tool: w_env_space Write {\"file_path\":\".env \",\"content\":\"x\"}\ntry-tool: w_tab_agents Write {\"file_path\":\"\\t.agents/x\",\"content\":\"x\"}\ntry: w_claude_settings .claude/settings.json\ntry: w_claude_md CLAUDE.md\ntry: w_spec proctor/specs/gw.yaml\ntry: w_spec_case PROCTOR/gw.yaml\ntry: w_makefile Makefile\ntry: w_gnumakefile GNUmakefile\ntry: w_encoded %2eagents/x\ntry: w_lookalike .аgents/x\ntry: w_agents_word agents/x.md\ntry: w_agents_suffix .agents.bak/x\ntry-tool: w_no_paths Write {\"content\":\"x\"}\ntry-tool: w_tool_case write {\"file_path\":\".agents/x\",\"content\":\"x\"}\ntry-tool: w_read Read {\"file_path\":\".agents/x\"}\ntry-run: w_bash_redirect echo x > .agents/x" }
