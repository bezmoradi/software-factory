      - ["unk_screenshot", "/api/screenshot", { sid: "00000000-0000-4000-8000-000000000000", name: a.png }, "session", "Only a session this engine started shows screenshots."]
      - ["unk_screenshot_dotdot", "/api/screenshot", { sid: "00000000-0000-4000-8000-000000000000", name: ../a.png }, "session", "Only a session this engine started shows screenshots."]
