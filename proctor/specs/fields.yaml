version: 2
suite: fields
tables:
  - id: FLD-T01
    name: "A route refuses a body its field check doesn't accept, naming the field"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 400
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: "${row.error}" }
    no_state_check: "refused with 400 by the route's own field check before it acts, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    waive: { EXE-09: { rows: [fld_remove_session, fld_remove_session_offer, fld_remove_repo], reason: "every row is refused with 400 by the route's own field check before it acts, so nothing can be removed: the remove-repo row's empty body names no repository, the fld_remove_session row's body names no session, and the fld_remove_session_offer row's flag and value are fields the route refuses" } }
