        "$.body.error": "${row.error}"
        "$.body.message": "${row.message}"
    columns: ["case", "route", "body", "error", "message"]
    rows:
      - ["msg_metrics_op", "/api/metrics", { op: write, repo: demo }, "op", "The engine reads a project's numbers, nothing else."]

  - id: FLD-T06
    name: "A route refuses a value a person typed that its rule doesn't take, with a message saying what it takes, so the page sends what was typed and shows the engine's answer"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 400
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: "${row.error}", message: "${row.message}" }
    no_state_check: "refused with 400 by the route's own check of the value before it saves, sends or starts anything, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    columns: ["case", "route", "body", "error", "message"]
    rows:
      - ["msg_identity_name_empty", "/api/commit-identity", { op: set, name: "", email: "12345+proctor@users.noreply.github.com" }, "name", "The name agents commit with needs 1 to 100 characters."]
      - ["msg_identity_name_long", "/api/commit-identity", { op: set, name: "${fill(401)}", email: "12345+proctor@users.noreply.github.com" }, "name", "The name agents commit with needs 1 to 100 characters."]
      - ["msg_identity_email", "/api/commit-identity", { op: set, name: Proctor Run, email: not-an-email }, "email", "The email needs the shape name@example.com, at most 254 characters with no spaces, such as GitHub's 12345+you@users.noreply.github.com."]
      - ["msg_decision_add_empty", "/api/decision-log", { op: add, repo: demo, text: "" }, "text", "An entry needs its text."]
      - ["msg_decision_add_long", "/api/decision-log", { op: add, repo: demo, text: "${fill(2001)}" }, "text", "A text is at most 500 characters, with no control characters but line breaks."]
      - ["msg_saved_prompt_name", "/api/saved-prompts", { op: save, repo: demo, name: "", text: proctor }, "name", "A prompt's name is one line of 1 to 60 characters."]
      - ["msg_add_repo_empty", "/api/add-repo", { url: "" }, "url", "Type the repository's https address."]
      - ["msg_add_repo_long", "/api/add-repo", { url: "${fill(4097)}" }, "url", "That address has characters a repository address doesn't use."]
      - ["msg_save_token_empty", "/api/save-token", { host: "gitserver.test:8443", token: "" }, "token", "A token is 1 to 4096 printable characters with no spaces."]
      - ["msg_queue_add_empty", "/api/session-work", { op: queue-add, sid: "00000000-0000-4000-8000-000000000000", text: "" }, "text", "Type the message to queue first."]
      - ["msg_login_code_empty", "/api/claude-login", { step: code, target: reviewers, code: "" }, "code", "Paste the code exactly as claude.com shows it."]
      - ["msg_message_revise_empty", "/api/message", { sid: "00000000-0000-4000-8000-000000000000", revise: { kind: requirements, note: " \n\t " } }, "note", "Type what should change first."]
      - ["msg_message_revise_long", "/api/message", { sid: "00000000-0000-4000-8000-000000000000", revise: { kind: requirements, note: "${fill(2001)}" } }, "note", "A note holds at most 2,000 characters."]
      - ["msg_message_images_many", "/api/message", { sid: "00000000-0000-4000-8000-000000000000", text: proctor, images: ["000000000000000000000001", "000000000000000000000002", "000000000000000000000003", "000000000000000000000004", "000000000000000000000005"] }, "text", "You can attach up to 4 images to a message."]
