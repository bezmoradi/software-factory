  - id: FLD-T01R
    name: "A route that only reads refuses a body its field check doesn't accept, naming the field"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 400
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: "${row.error}" }
    columns: ["case", "route", "body", "error"]
    rows:
