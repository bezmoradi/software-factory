scenarios:
  - id: FLD-001
    name: "Deleting a session the engine didn't start is refused, with no offer to force it"
    steps:
      - id: unknown-before
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "00000000-0000-4000-8000-000000000000" }
        expect:
          equal:
            "$.status": 409
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: "not started here", message: "Only a session this engine started has a workflow here." }
      - id: remove-unknown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/remove-session"
          headers: { Origin: "${page.origin}" }
          body: { sid: "00000000-0000-4000-8000-000000000000" }
        expect:
          equal:
            "$.status": 409
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: "not started here", message: "Only a session this engine started can be stopped, woken or deleted from here.", offer: null }
      - id: still-unknown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "00000000-0000-4000-8000-000000000000" }
        expect:
          equal:
            "$.status": 409
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: "not started here", message: "Only a session this engine started has a workflow here." }

  - id: FLD-002
    name: "The file reads refuse a session the engine didn't start, before opening anything"
    steps:
      - id: file-outside
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/file"
          headers: { Origin: "${page.origin}" }
          body: { sid: "00000000-0000-4000-8000-000000000000", path: README.md }
        expect:
          equal:
            "$.status": 422
            "$.body": { error: outside, message: "Only files inside this session's project open here." }
      - id: file-check-unverified
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/file-check"
          headers: { Origin: "${page.origin}" }
          body: { sid: "00000000-0000-4000-8000-000000000000", paths: [README.md] }
        expect:
          equal:
            "$.status": 409
            "$.body": { error: unverified, message: "The engine didn't start this session, so it shows none of its files." }

  - id: FLD-003
    name: "The engine's copy of a session's commits isn't shown for a session it holds no branch of"
    steps:
      - id: keep-unknown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/keep"
          headers: { Origin: "${page.origin}" }
          body: { op: read, sid: "00000000-0000-4000-8000-000000000000" }
        expect:
          equal:
            "$.status": 404
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: session, message: "This engine holds no branch for that session: it was deleted or not started here." }
        no_state_check: "op read changes nothing, and it's refused with 404 since no session has this id; /api/keep isn't declared a read, since op restore on the same path rewrites a branch and HTTP-11 matches the path only, and no other read shows the engine's copy"

  - id: FLD-004
    name: "A Save that changes nothing answers 200 with the engine's No change warning instead of Saved, so the page shows the engine's words and tone: a project's caps, review settings, a saved prompt, an entry of the decision log, the Git name and email and the company gateway; each step puts back what it changed"
    steps:
      - id: caps-set
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/limits"
          headers: { Origin: "${page.origin}" }
          body: { op: project, name: demo, money: 0, minutes: 0, turns: 500 }
        expect:
          equal:
            "$.status": 200
            "$.body.message": "Saved. New sessions in this project get these caps."
            "$.body.tone": ok
            "$.body.projects[0].turns": 500
          length: { "$.body.projects": 1 }
        no_state_check: "no declared read shows a project's caps: only /api/limits answers them, and its op decides read or write (op project saves them), so it isn't declared a read; caps-same's answer shows them saved, and caps-none reads them back after caps-cleared"
      - id: caps-same
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/limits"
          headers: { Origin: "${page.origin}" }
          body: { op: project, name: demo, money: 0, minutes: 0, turns: 500 }
        expect:
          equal:
            "$.status": 200
            "$.body.message": "No change: these caps are already saved."
            "$.body.tone": warn
            "$.body.projects[0].turns": 500
          length: { "$.body.projects": 1 }
        no_state_check: "saves nothing, since the caps are already these, as the answer's No change says; no declared read shows a project's caps: only /api/limits answers them, and its op decides read or write (op project saves them), so it isn't declared a read; caps-none reads them back after caps-cleared"
      - id: caps-cleared
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/limits"
          headers: { Origin: "${page.origin}" }
          body: { op: project, name: demo, money: 0, minutes: 0, turns: 0 }
        expect:
          equal:
            "$.status": 200
            "$.body.message": "Saved. New sessions in this project get these caps."
            "$.body.tone": ok
        no_state_check: "no declared read shows a project's caps: only /api/limits answers them, and its op decides read or write (op project saves them), so it isn't declared a read; caps-none reads them back"
      - id: caps-none
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/limits"
          headers: { Origin: "${page.origin}" }
          body: { op: read }
        expect:
          equal:
            "$.status": 200
          absent: ["$.body.message", "$.body.tone"]
          length: { "$.body.projects": 0 }
        no_state_check: "op read changes nothing; /api/limits isn't declared a read, since op project, session and raise on the same path save caps"
      - id: depth-set
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/review-depth"
          headers: { Origin: "${page.origin}" }
          body: { op: set, path: /workspace/base/demo, reviewers: {}, maxLines: 400, twice: true }
