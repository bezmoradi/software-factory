      - ["fld_file", "/api/file", {}, "fields"]
      - ["fld_file_check", "/api/file-check", { proctorUnknownField: true }, "fields"]

  - id: FLD-T02
    name: "A route refuses an operation or mode it doesn't have, with a message saying what it does"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 400
        "$.body.error": "${row.error}"
        "$.body.message": "${row.message}"
    no_state_check: "refused with 400 by the route's own field check before it acts, so the route changed nothing; no single read the page offers shows the state of every route in this table, and a table row can't name a read of its own"
    columns: ["case", "route", "body", "error", "message"]
    rows:
      - ["msg_dispatch_mode", "/api/dispatch", { path: /workspace/base/demo, agent: dev-acp, mode: bypassPermissions }, "mode", "The page starts every session in the agent's asking mode, never auto mode."]
      - ["msg_keep_op", "/api/keep", { op: write, sid: "00000000-0000-4000-8000-000000000000" }, "op", "The engine reads its copy of a session's commits and restores the branch from it only."]
      - ["msg_verify_op", "/api/verify", { op: write, sid: "00000000-0000-4000-8000-000000000000" }, "op", "The engine reads, starts and stops a session's verification runs and reads a browser run's files only."]
      - ["msg_verify_kind", "/api/verify", { op: start, sid: "00000000-0000-4000-8000-000000000000", kind: video }, "kind", "The engine runs two kinds of verification: check and browser."]
      - ["msg_verify_main_op", "/api/verify", { op: stop, repo: demo, id: "0123456789abcdef" }, "op", "The engine reads and starts a project's verification runs on main only."]
      - ["msg_verify_main_kind", "/api/verify", { op: start, repo: demo, kind: browser }, "kind", "The engine runs verification runs of one kind on main: check."]
      - ["msg_verify_attachment_name", "/api/verify", { op: attachment, sid: "00000000-0000-4000-8000-000000000000", id: "0123456789abcdef", name: "trace.webm" }, "name", "A browser run's file is a .png, .jpg, .jpeg, .gif or .zip with a plain name of at most 124 bytes."]
      - ["msg_project_browser", "/api/project-commands", { op: set, name: demo, check: "", setup: "", browser: "npx playwright test\u0007" }, "browser", "A browser command is one line of at most 300 bytes, with no control characters."]
      - ["msg_project_image", "/api/project-commands", { op: set, name: demo, check: "", setup: "", image: "node:latest" }, "image", "The image for verification runs is a name pinned by digest, such as node@sha256: and 64 hexadecimal digits, of at most 300 bytes."]

  - id: FLD-T02R
    name: "A route that only reads refuses an operation other than read, with a message saying so"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 400
        "$.body.error": "${row.error}"
        "$.body.message": "${row.message}"
    columns: ["case", "route", "body", "error", "message"]
    rows:
      - ["msg_metrics_op", "/api/metrics", { op: write, repo: demo }, "op", "The engine reads a project's numbers, nothing else."]

  - id: FLD-T03
    name: "A route that acts on a session refuses an id the engine didn't start"
    do: http.request
    identity: page
    with:
      method: POST
      path: "${row.route}"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 409
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: "not started here", message: "${row.message}" }
    no_state_check: "refused with 409 because the engine started no session with this id, before the route acts, so nothing changed; no single read shows the state of every route in this table, and a table row can't name a read of its own"
    columns: ["case", "route", "body", "message"]
    rows:
      - ["unk_lock", "/api/lock-tests", { sid: "00000000-0000-4000-8000-000000000000", op: lock, head: "0123456789abcdef0123456789abcdef01234567" }, "Only a session this engine started has a workflow here."]
      - ["unk_unlock", "/api/lock-tests", { sid: "00000000-0000-4000-8000-000000000000", op: unlock }, "Only a session this engine started has a workflow here."]
      - ["unk_push", "/api/push", { sid: "00000000-0000-4000-8000-000000000000" }, "Only a session this engine started can be pushed from here."]
      - ["unk_viewed", "/api/viewed", { sid: "00000000-0000-4000-8000-000000000000", path: README.md, blob: "0123456789abcdef0123456789abcdef01234567", viewed: true }, "Only a session this engine started has a changes view here."]
      - ["unk_stop", "/api/stop-session", { sid: "00000000-0000-4000-8000-000000000000" }, "Only a session this engine started can be stopped, woken or deleted from here."]
      - ["unk_verify_read", "/api/verify", { op: read, sid: "00000000-0000-4000-8000-000000000000" }, "Only a session this engine started has verification runs here."]
      - ["unk_verify_start", "/api/verify", { op: start, sid: "00000000-0000-4000-8000-000000000000", kind: check }, "Only a session this engine started can be verified here."]
      - ["unk_push_record", "/api/push-record", { sid: "00000000-0000-4000-8000-000000000000", commit: "0123456789abcdef0123456789abcdef01234567" }, "Only a session this engine started has push records here."]
      - ["unk_verify_start_browser", "/api/verify", { op: start, sid: "00000000-0000-4000-8000-000000000000", kind: browser }, "Only a session this engine started can be verified here."]
      - ["unk_verify_attachment", "/api/verify", { op: attachment, sid: "00000000-0000-4000-8000-000000000000", id: "0123456789abcdef", name: home.png }, "Only a session this engine started has verification runs here."]

  - id: FLD-T05
    name: "/api/limits refuses to measure, raise for each kind of cap, stop or set caps for a session the engine didn't start; SES-003 pins a Raise of a kind a session isn't at"
    do: http.request
    identity: page
    with:
      method: POST
      path: "/api/limits"
      headers: { Origin: "${page.origin}" }
      body: "${row.body}"
    expect:
      equal:
        "$.status": 409
        "$.headers.content-type": ["application/json; charset=utf-8"]
        "$.body": { error: "${row.error}", message: "${row.message}" }
    no_state_check: "refused with 409 before the route acts: no session has this id, so none is at a cap, and Limits.SetSession, Raise, StopAtCap and MeasureNow change nothing; /api/limits isn't declared a read, since its op decides read or write, and no other read shows caps"
    columns: ["case", "body", "error", "message"]
    rows:
      - ["lim_measure_unknown", { op: measure, sid: "00000000-0000-4000-8000-000000000000" }, "not reached", "This session isn't at its disk cap, so there is nothing to check again."]
      - ["lim_raise_disk_unknown", { op: raise, sid: "00000000-0000-4000-8000-000000000000", kind: disk, value: 2 }, "not reached", "This session isn't at that cap, so there is nothing to raise."]
      - ["lim_raise_money_unknown", { op: raise, sid: "00000000-0000-4000-8000-000000000000", kind: money, value: 2 }, "not reached", "This session isn't at that cap, so there is nothing to raise."]
      - ["lim_raise_time_unknown", { op: raise, sid: "00000000-0000-4000-8000-000000000000", kind: time, value: 2 }, "not reached", "This session isn't at that cap, so there is nothing to raise."]
      - ["lim_raise_turns_unknown", { op: raise, sid: "00000000-0000-4000-8000-000000000000", kind: turns, value: 2 }, "not reached", "This session isn't at that cap, so there is nothing to raise."]
      - ["lim_stop_unknown", { op: stop, sid: "00000000-0000-4000-8000-000000000000" }, "not reached", "This session isn't at a cap."]
      - ["lim_session_unknown", { op: session, sid: "00000000-0000-4000-8000-000000000000", money: 1, minutes: 1, turns: 1 }, "not started here", "Only a session this engine started can have caps."]
      - ["lim_session_disk_unknown", { op: session, sid: "00000000-0000-4000-8000-000000000000", money: 0, minutes: 0, turns: 0, disk: 1 }, "not started here", "Only a session this engine started can have caps."]

