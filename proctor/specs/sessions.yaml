            "$.body.queued": false
            "$.body.current": null
          matches: { "$.body.head": "[0-9a-f]{40}" }
      - id: helper-image
        do: docker.container
        with: { name: sf-proctor-helper-1 }
        expect:
          equal: { "$.found": true }
        save: { helper_image: "$.container.image" }
      - id: set-main-check
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: set, name: demo, check: "sleep 8 && test -f README.md && echo ${run.id}", setup: "", image: "proctor@${helper_image}" }
        expect:
          equal:
            "$.status": 200
            "$.body.check": "sleep 8 && test -f README.md && echo ${run.id}"
        no_state_check: "no declared read shows a project's commands: only /api/project-commands op read and /api/verify answer them, and each acts for another op on the same path (op set saves the commands, op start starts a run), so neither can be declared a read; main-check-read-back reads them back, and main-container shows the run on main using the image"
      - id: main-check-read-back
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: read, name: demo }
        expect:
          equal:
            "$.status": 200
            "$.body.image": "proctor@${helper_image}"
        no_state_check: "op read changes nothing; /api/project-commands isn't declared a read, since op set on the same path saves the commands"
      - id: main-start
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/verify"
          headers: { Origin: "${page.origin}" }
          body: { op: start, repo: demo, kind: check }
        expect:
          equal:
            "$.status": 202
          matches: { "$.body.id": "[0-9a-f]{16}", "$.body.commit": "[0-9a-f]{40}" }
        save: { run: "$.body.id", commit: "$.body.commit" }
      - id: main-second
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/verify"
          headers: { Origin: "${page.origin}" }
          body: { op: start, repo: demo, kind: check }
        expect:
          equal:
            "$.status": 409
            "$.body": { error: running, message: "A run of the check on main is running for this project. Wait for it." }
      - id: main-container
        do: docker.container
        with: { name: "sf-proctor-verify-${run}" }
        eventually: { within: 30s, every: 1s }
        expect:
          equal:
            "$.found": true
            "$.container.image": "${helper_image}"
            "$.container.user": "10006:10006"
            "$.container.readonly_rootfs": true
            "$.container.network_mode": none
            "$.container.docker_socket": false
            "$.container.mounts":
              - { type: volume, destination: /in, read_only: true, volume: sf-proctor_verify, subpath: "${run}", source: null }
      - id: main-container-gone
        do: docker.container
        with: { name: "sf-proctor-verify-${run}" }
        eventually: { within: 90s, every: 1s }
        expect:
          equal: { "$.found": false }
      - id: clear-main-commands
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: set, name: demo, check: "", setup: "", image: "" }
        expect:
          equal:
            "$.status": 200
            "$.body": { check: "", setup: "", image: "", browser: "", max: 300, maxImage: 300, message: "Saved. New turns and new sessions use them.", tone: ok }
        no_state_check: "no declared read shows a project's commands: only /api/project-commands op read and /api/verify answer them, and each acts for another op on the same path (op set saves the commands, op start starts a run), so neither can be declared a read; main-cleared reads them back empty, and main-recorded's why shows the change"
      - id: main-cleared
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: read, name: demo }
        expect:
          equal:
            "$.status": 200
            "$.body.check": ""
        no_state_check: "op read changes nothing; /api/project-commands isn't declared a read, since op set on the same path saves the commands"
      - id: main-recorded
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/verify"
          headers: { Origin: "${page.origin}" }
          body: { op: read, repo: demo }
        expect:
          equal:
            "$.status": 200
            "$.body.head": "${commit}"
            "$.body.current": null
            "$.body.runs[0].id": "${run}"
            "$.body.runs[0].commit": "${commit}"
            "$.body.runs[0].by": page
            "$.body.runs[0].image": "proctor@${helper_image}"
            "$.body.why": "The check command or the project's verification image changed since the last run, so it doesn't count."
        no_state_check: "op read changes nothing; /api/verify isn't declared a read, since op start on the same path starts a run"

  - id: SES-006
    name: "The new-session form's suggested name is an adjective and a noun from the engine's two lists, lowercase and joined by a hyphen, with a number after a second hyphen only when every pick was taken; one answer's adjective and another's noun are each matched against their whole list, since one pattern holding both lists is over Proctor's 1,024 bytes; the route takes no field"
    steps:
      - id: adjective-listed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/session-name"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.headers.cache-control": ["no-store"]
          matches: { "$.body.name": '(agile|amber|arcane|astute|audacious|azure|balanced|beaming|bold|brave|bright|brilliant|calm|careful|celestial|cheerful|clever|cosmic|crafty|curious|daring|dazzling|deep|determined|dynamic|eager|electric|elegant|emerald|energetic|epic|fearless|fierce|focused|fortunate|friendly|frosty|gentle|glowing|golden|graceful|grand|happy|heroic|hidden|honest|humble|infinite|ingenious|inspired|keen|kind|lively|lucky|luminous|magnetic|majestic|mighty|mindful|mystic|nimble|noble|optimal|patient|peaceful|playful|polished|powerful|precise|primal|radiant|rapid|reliable|resilient|robust|rugged|savvy|serene|sharp|silent|silver|sleek|smart|soaring|solid|spirited|steady|stellar|strategic|subtle|sunny|swift|tenacious|tranquil|unified|valiant|vibrant|vivid|wise|zen)-[a-z]+(-[0-9]+)?' }
      - id: noun-listed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/session-name"
          headers: { Origin: "${page.origin}" }
          body: {}
        expect:
          equal:
            "$.status": 200
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.headers.cache-control": ["no-store"]
          matches: { "$.body.name": '[a-z]+-(albatross|anvil|badger|beacon|bison|bluejay|boulder|bridge|canyon|captain|cascade|castle|cheetah|circuit|comet|compass|condor|coral|cougar|crystal|dolphin|dragon|eagle|eclipse|falcon|feather|ferret|firefly|fjord|flamingo|forge|fox|gazelle|gecko|glacier|glider|griffin|hammer|harbor|heron|horizon|ibex|island|jaguar|kestrel|kingfisher|lantern|leopard|lightning|lynx|marble|meadow|meteor|monarch|mongoose|mountain|nebula|nightingale|oasis|octopus|orchid|otter|owl|panther|paradox|phoenix|pioneer|planet|prism|puma|quartz|raven|reef|rocket|sailor|satellite|scarab|scout|shark|sparrow|sphinx|spider|squirrel|starling|summit|thunder|tiger|tortoise|trident|turbine|turtle|vanguard|voyager|walrus|warbler|whale|wolf|wombat|zenith|zephyr)(-[0-9]+)?' }
      - id: unknown-field
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/session-name"
          headers: { Origin: "${page.origin}" }
          body: { proctorUnknownField: true }
        expect:
          equal:
            "$.status": 400
            "$.headers.content-type": ["application/json; charset=utf-8"]
            "$.body": { error: fields, message: "The request holds a field this route doesn't take, or a field of the wrong type. Reload the page and try again." }
