        expect:
          equal:
            "$.found": true
            "$.container.image": "${helper_image}"
            "$.container.state.running": true
            "$.container.user": "10006:10006"
            "$.container.init": true
            "$.container.readonly_rootfs": true
            "$.container.privileged": false
            "$.container.cap_add": []
            "$.container.cap_drop": [ALL]
            "$.container.security_opt": ["no-new-privileges:true"]
            "$.container.oom_score_adj": 800
            "$.container.pids_limit": 2048
            "$.container.memory": 4294967296
            "$.container.memory_swap": 4294967296
            "$.container.nano_cpus": 2000000000
            "$.container.restart_policy": { name: "no", maximum_retry_count: 0 }
            "$.container.log_driver": json-file
            "$.container.network_mode": none
            "$.container.extra_hosts": []
            "$.container.ipc_mode": private
            "$.container.cgroupns_mode": private
            "$.container.shm_size": 67108864
            "$.container.ports": []
            "$.container.publish_all_ports": false
            "$.container.devices": 0
            "$.container.device_requests": 0
            "$.container.group_add": []
            "$.container.docker_socket": false
            "$.container.tmpfs": ["/tmp", "/work"]
            "$.container.mounts":
              - { type: volume, destination: /in, read_only: true, volume: sf-proctor_verify, subpath: "${run}", source: null }
          any:
            "$.container.labels": [{ key: dev.software-factory.stack, value: sf-proctor }, { key: dev.software-factory.verifier, value: "${run}" }, { key: com.docker.compose.project, value: "" }]
          count:
            "$.container.labels": { where: { key: dev.software-factory.recipe }, is: 1 }
          none:
            "$.container.labels": { key: dev.software-factory.box }
      - id: run-ended
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        eventually: { within: 90s, every: 1s }
        expect:
          equal:
            "$.status": 200
          any:
            "$.body.entries": { kind: verify, result: ended, session: "${sid}", commit: "${head}", reason: "kind check, state passed, exit 0" }
      - id: run-container-gone
