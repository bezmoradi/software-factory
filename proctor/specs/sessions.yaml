        expect:
          equal:
            "$.status": 200
            "$.body.current.id": "${run}"
            "$.body.current.commit": "${head}"
            "$.body.current.state": passed
            "$.body.current.code": 0
            "$.body.current.imageId": "${helper_image}"
            "$.body.current.limitSeconds": 900
            "$.body.current.withheld": false
            "$.body.why": ""
      - id: other-command
        do: http.request
