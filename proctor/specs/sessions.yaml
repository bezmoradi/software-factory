        expect:
          equal: { "$.found": true }
        save: { helper_image: "$.container.image" }
      - id: set-image
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: set, name: demo, check: "sleep 8 && test -f README.md && echo ${run.id}", setup: "", image: "proctor@${helper_image}" }
        expect:
          equal:
            "$.status": 200
            "$.body": { check: "sleep 8 && test -f README.md && echo ${run.id}", setup: "", image: "proctor@${helper_image}", browser: "", max: 300, maxImage: 300, message: "Saved. New turns and new sessions use them.", tone: ok }
        no_state_check: "no declared read shows a project's commands: only /api/project-commands op read and /api/verify answer them, and each acts for another op on the same path (op set saves the commands, op start starts a run), so neither can be declared a read; image-read-back reads them back, and verify-start's answer and run-container show the run using them"
      - id: set-image-again
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: set, name: demo, check: "sleep 8 && test -f README.md && echo ${run.id}", setup: "", image: "proctor@${helper_image}" }
        expect:
          equal:
            "$.status": 200
            "$.body": { check: "sleep 8 && test -f README.md && echo ${run.id}", setup: "", image: "proctor@${helper_image}", browser: "", max: 300, maxImage: 300, message: "No change: these commands are already saved.", tone: warn }
        no_state_check: "saves nothing, since the commands are already these, as the answer's No change says; no declared read shows a project's commands: only /api/project-commands op read and /api/verify answer them, and each acts for another op on the same path (op set saves the commands, op start starts a run), so neither can be declared a read; image-read-back reads them back"
      - id: image-read-back
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/project-commands"
          headers: { Origin: "${page.origin}" }
          body: { op: read, name: demo }
        expect:
          equal:
            "$.status": 200
            "$.body.image": "proctor@${helper_image}"
            "$.body.check": "sleep 8 && test -f README.md && echo ${run.id}"
        no_state_check: "op read changes nothing; /api/project-commands isn't declared a read, since op set on the same path saves the commands"
      - id: verify-start
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/verify"
          headers: { Origin: "${page.origin}" }
          body: { op: start, sid: "${sid}", kind: check }
        expect:
          equal:
            "$.status": 200
            "$.body.hasCheck": true
            "$.body.image": "proctor@${helper_image}"
            "$.body.command": "sleep 8 && test -f README.md && echo ${run.id}"
            "$.body.runs[0].state": running
            "$.body.runs[0].by": page
            "$.body.runs[0].image": "proctor@${helper_image}"
          length: { "$.body.runs": 1 }
          matches: { "$.body.runs[0].id": "[0-9a-f]{16}" }
        save: { run: "$.body.runs[0].id", head: "$.body.head" }
      - id: run-container
        do: docker.container
