  - id: SES-004
    name: "A verification run copies the session's commit into a container of the project's image pinned by digest, with no network, a read-only root and only its run's folder mounted read-only, and records a pass from Docker's exit; another command makes the pass not count"
    steps:
      - id: start
        do: http.request
        identity: page
        timeout: 110s
        with:
          method: POST
          path: "/api/dispatch"
          headers: { Origin: "${page.origin}" }
          body: { path: /workspace/base/demo, agent: dev-acp, name: "proctor verify ${run.id}" }
        expect:
          equal:
            "$.status": 202
            "$.body.ok": true
          present: ["$.body.id", "$.body.sid"]
        save: { sid: "$.body.sid", id: "$.body.id" }
      - id: audited
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/audit"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.entries[0].kind": session-start
          present: ["$.body.entries[0].box"]
        save: { box: "$.body.entries[0].box" }
      - id: typed
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/size"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}", size: explore }
        expect:
          equal:
            "$.status": 200
            "$.body": { ok: true }
        waive: { FIX-05: "size is one of the fixed work types (change, incident, explore) and can't carry ${run.id}; the work type is set by /api/size now that /api/dispatch takes none, and typed-shown and every later step read the session saved from this scenario's dispatch, so no earlier run's session can match" }
      - id: typed-shown
        do: http.request
        identity: page
        with:
          method: POST
          path: "/api/gate"
          headers: { Origin: "${page.origin}" }
          body: { sid: "${sid}" }
        expect:
          equal:
            "$.status": 200
            "$.body.gate.chosen": true
            "$.body.gate.workType": explore
      - id: helper-image
        do: docker.container
