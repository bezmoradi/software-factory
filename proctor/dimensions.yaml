  body_limited_routes: ["/api/approve-plan", "/api/approve-requirements", "/api/reviewer-agents"]
  other_methods: [PUT, DELETE, PATCH]
  refused_key_variants: [unknown, basic_scheme, token_scheme, no_scheme]
  replaced_key_variants: [replaced]
sets:
  no_key:
    columns: { route: post_routes }
    except:
      - cells: { route: "/api/session" }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it takes no key: a row without a key would sign in and end the run's key; sign-in.yaml checks its refusals"
  other_host:
    columns: { route: post_routes }
  other_origin:
    columns: { route: post_routes }
  cross_site:
    columns: { route: post_routes }
  no_origin:
    columns: { route: post_routes }
  not_json:
    columns: { route: post_routes }
  json_over_64k:
    columns: { route: post_routes }
    except:
      - cells: { route: "/api/upload" }
        reason: "/api/upload takes an image or a file, not JSON, so a JSON body is refused with 415 before any size check; its own limits, 2.5 MiB for an image and 10 MiB for a file, are checked in bodies.yaml"
      - cells: { route: "/api/import" }
        reason: "/api/import takes application/gzip, not JSON, so a JSON body is refused with 415 before any size check; its own 256 MiB limit is checked in bodies.yaml"
      - cells: { route: "/api/approve-plan" }
        reason: "/api/approve-plan takes a body of up to 1 MiB (MaxApproveBody), so a 64 KiB body isn't over its limit; json_over_1m checks it"
      - cells: { route: "/api/approve-requirements" }
        reason: "/api/approve-requirements takes a body of up to 1 MiB (MaxApproveBody), so a 64 KiB body isn't over its limit; json_over_1m checks it"
      - cells: { route: "/api/reviewer-agents" }
        reason: "/api/reviewer-agents takes a body of up to 1 MiB (MaxApproveBody), so a 64 KiB body isn't over its limit; json_over_1m checks it"
      - cells: { route: "/api/packs" }
        reason: "/api/packs takes a body of up to 2 MiB (MaxPackBody), for an uploaded pack's files, so a 64 KiB body isn't over its limit; packs.yaml's PCK-002 sends one over 2 MiB and one just under"
  json_over_1m:
    columns: { route: body_limited_routes }
  query:
    columns: { route: post_routes }
  get:
    columns: { route: post_routes }
  other_method:
    columns: { route: post_routes, method: other_methods }
  other_method_no_origin:
    columns: { route: post_routes, method: other_methods }
  same_site:
    columns: { route: post_routes }
  other_key:
    columns: { route: post_routes, variant: refused_key_variants }
    except:
      - cells: { route: "/api/session", variant: unknown }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it never reads a key in any form: a row would be a sign-in, which ends the run's key; sign-in.yaml checks its refusals"
      - cells: { route: "/api/session", variant: basic_scheme }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it never reads a key in any form: a row would be a sign-in, which ends the run's key; sign-in.yaml checks its refusals"
      - cells: { route: "/api/session", variant: token_scheme }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it never reads a key in any form: a row would be a sign-in, which ends the run's key; sign-in.yaml checks its refusals"
      - cells: { route: "/api/session", variant: no_scheme }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it never reads a key in any form: a row would be a sign-in, which ends the run's key; sign-in.yaml checks its refusals"
  replaced_key:
    columns: { route: post_routes, variant: replaced_key_variants }
    except:
      - cells: { route: "/api/session", variant: replaced }
        reason: "/api/session is the sign-in route, which the page serves before its key check, so it never reads a key in any form: a row would be a sign-in, which ends the run's key; sign-in.yaml checks its refusals"
  unknown_field:
    columns: { route: post_routes }
    except:
      - cells: { route: "/api/session" }
        reason: "/api/session is the sign-in route, and each request to it counts toward the page's sign-in rate before its body is read, so a row there could make a later sign-in 429; sign-in.yaml's SGN-001 checks a sign-in with a field, refused with 400 body before a key is issued"
      - cells: { route: "/api/upload" }
        reason: "/api/upload takes an image or a file, not a JSON object, so a JSON body is refused with 415 before any field is read; bodies.yaml checks its bodies"
      - cells: { route: "/api/import" }
        reason: "/api/import takes application/gzip, not a JSON object, so a JSON body is refused with 415 before any field is read; bodies.yaml checks its bodies"
