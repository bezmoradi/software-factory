format: "proctor-transcript/1"
scenario: "REP-004"
specification: "repositories"
steps:
  - do: "http.request"
    fact:
      body:
        name: "proctor-${run.id}"
        ok: true
        url: "https://gitserver.test:8443/dev/proctor-${run.id}.git"
      header_lists:
        cache-control:
          - "no-store"
        content-length:
          - "123"
        content-security-policy:
          - "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
        content-type:
          - "application/json; charset=utf-8"
        cross-origin-opener-policy:
          - "same-origin"
        cross-origin-resource-policy:
          - "same-origin"
        date: "<date_list>"
        referrer-policy:
          - "no-referrer"
        x-content-type-options:
          - "nosniff"
        x-frame-options:
          - "DENY"
        x-sf-request: "<request_id_list-1>"
      headers:
        cache-control:
          - "no-store"
        content-length:
          - "123"
        content-security-policy:
          - "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
        content-type:
          - "application/json; charset=utf-8"
        cross-origin-opener-policy:
          - "same-origin"
        cross-origin-resource-policy:
          - "same-origin"
        date: "<date>"
        referrer-policy:
          - "no-referrer"
        x-content-type-options:
          - "nosniff"
        x-frame-options:
          - "DENY"
        x-sf-request: "<request_id-1>"
      status: 202
    id: "add-missing"
    identity: "page"
    phase: "verification"
    with:
      body:
        url: "https://gitserver.test:8443/dev/proctor-${run.id}.git"
      headers:
        Origin: "${page.origin}"
      method: "POST"
      path: "/api/add-repo"
  - do: "http.request"
    fact:
      body:
        cloning: []
        hostNotes:
          "https://gitlab.com": "Pull requests and issues work only on GitHub."
        hosts:
          - host: "https://gitserver.test:8443"
            savedAt: "<hosts_saved_at-1>"
        offerHosts:
          - "https://github.com"
          - "https://gitlab.com"
        projects:
          - addedAt: "<added_at-1>"
            agents: []
            autoFindings: false
            branch: "main"
            hold:
              afterBlock: false
              maxFiles: 0
              maxLines: 0
            instructions: []
            name: "demo"
            path: "/workspace/base/demo"
            prComment: false
            rounds: 3
            roundsMax: 20
            type: ""
            types:
              - builtin: true
                edits: "any"
                id: "change"
                name: "Code change"
                push: true
                roles:
                  - "bug-hunter"
                  - "simplicity"
                steps:
                  - "define"
                  - "plan"
                  - "implement"
                  - "review"
                  - "push"
              - builtin: true
                edits: "any"
                id: "incident"
                name: "Incident"
                push: true
                roles:
                  - "bug-hunter"
                  - "simplicity"
                startWarning: "An incident is debugged at the commit that's deployed, and main is likely not what's running. Set Start from below to the branch whose head is deployed, and give the deployed commit or tag in the first message. When the session's start isn't that commit, knackpack diagnoses in a worktree of its own, outside this session's branch, and the page can't read or approve its root cause."
                steps:
                  - "implement"
                  - "review"
                  - "push"
              - builtin: true
                edits: "any"
                id: "explore"
                name: "Explore"
                push: false
                roles: []
                steps:
                  - "implement"
            url: "https://gitserver.test:8443/dev/demo.git"
        readiness: []
        repos: true
        reviewer:
          expect: "any"
        starters:
          - command: "claude --bg"
            default: true
            defaultEffort: "high"
            defaultModel: "opus"
            efforts:
              - "low"
              - "medium"
              - "high"
              - "xhigh"
              - "max"
            enabled: true
            expect: "any"
            fields:
              effort: true
              expect: false
              model: true
            id: "claude"
            method: "plugin"
            models:
              - efforts:
                  - "low"
                  - "medium"
                  - "high"
                  - "xhigh"
                  - "max"
                id: "fable"
                name: "Fable"
              - efforts:
                  - "low"
                  - "medium"
                  - "high"
                  - "xhigh"
                  - "max"
                id: "opus"
                name: "Opus"
              - efforts:
                  - "low"
                  - "medium"
                  - "high"
                  - "xhigh"
                  - "max"
                id: "sonnet"
                name: "Sonnet"
              - efforts:
                  - "low"
                  - "medium"
                  - "high"
                  - "xhigh"
                  - "max"
                id: "haiku"
                name: "Haiku"
            name: "Claude Code"
          - command: "its ACP server"
            efforts: []
            enabled: true
            expect: "any"
            fields:
              effort: false
              expect: true
              model: false
            id: "dev-acp"
            method: "acp"
            models: []
            name: "Development ACP agent"
      header_lists:
        cache-control:
          - "no-store"
        content-security-policy:
          - "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
        content-type:
          - "application/json; charset=utf-8"
        cross-origin-opener-policy:
          - "same-origin"
        cross-origin-resource-policy:
          - "same-origin"
        date: "<date_list>"
        referrer-policy:
          - "no-referrer"
        x-content-type-options:
          - "nosniff"
        x-frame-options:
          - "DENY"
        x-sf-request: "<request_id_list-2>"
      headers:
        cache-control:
          - "no-store"
        content-security-policy:
          - "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
        content-type:
          - "application/json; charset=utf-8"
        cross-origin-opener-policy:
          - "same-origin"
        cross-origin-resource-policy:
          - "same-origin"
        date: "<date>"
        referrer-policy:
          - "no-referrer"
        x-content-type-options:
          - "nosniff"
        x-frame-options:
          - "DENY"
        x-sf-request: "<request_id-2>"
      status: 200
    id: "clone-ended-unlisted"
    identity: "page"
    phase: "verification"
    poll:
      mode: "eventually"
      window: "1m0s"
    with:
      body: {}
      headers:
        Origin: "${page.origin}"
      method: "POST"
      path: "/api/projects"
